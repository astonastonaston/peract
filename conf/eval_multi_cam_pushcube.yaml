method:
    name: "PERACT_BC"

maniskill3:
    # multi-task training is not supported yet
    task_name: "multi"
    tasks: [ PushCube-v1 ]
    episode_length: 6 # TODO: Set this number. Note this is the number of POSE-based plannings to do
    traj_path: /home/nan/Desktop/peract/demos/PushCube-v1/motionplanning/multiCam/trajectory.pointcloud.pd_joint_pos.h5
    json_path: /home/nan/Desktop/peract/demos/PushCube-v1/motionplanning/multiCam/trajectory.pointcloud.pd_joint_pos.json
    desc_pkl_path: /home/nan/Desktop/peract/demos/PushCube-v1/motionplanning/desc.pkl
    cameras: [ base_camera, left_shoulder_camera, right_shoulder_camera, hand_camera ]
    camera_resolution: [ 128, 128 ]
    scene_bounds: [ -0.4, -0.4, -0.4, 0.5, 0.5, 0.5 ]
    time_in_state: True
    include_lang_goal_in_obs: True
    vis_pose: False

framework:
    tensorboard_logging: True
    csv_logging: True
    gpu: 0
    logdir: '/home/nan/Desktop/peract/ckpts/'
    train_cfg_path: '/home/nan/Desktop/peract/conf/config.yaml'
    start_seed: 0
    record_every_n: 5

    eval_envs: 1
    eval_from_eps_number: 10 # current eatio: train/val/test = 150/25/25
    eval_episodes: 10
    eval_demo_type: 'motionplanning'
    eval_type: 'last' # or 'best'
    eval_save_metrics: True
    eval_save_voxel_images: False # whether or not to save voxel images for each pose step during evaluation

cinematic_recorder:
    enabled: False
    camera_resolution: [ 1280, 720 ]
    fps: 30
    rotate_speed: 0.005
    save_path: '/home/nan/Desktop/peract/videos/'

wandb:
  use: True
  project_name: 'peract'
  exp_name: 'peract-eval-multiview-${maniskill3.tasks[0]}-motionplanning-demos-${framework.eval_episodes}-seed-${framework.start_seed}-se3aug-${wandb.se3aug}'
