method:
  name: "PERACT_BC"

maniskill3:
  # multi-task training is not supported yet
  task_name: "multi"
  tasks: [ PickCube-v1 ]
  episode_length: 8 # TODO: Set this number. Note this is the number of POSE-based plannings to do
  traj_path: /peract/demos/PickCube-v1/motionplanning/trajectory.pointcloud.pd_joint_pos.cpu.h5
  json_path: /peract/demos/PickCube-v1/motionplanning/trajectory.pointcloud.pd_joint_pos.cpu.json
  desc_pkl_path: /peract/desc.pkl
  cameras: [ base_camera ]
  camera_resolution: [ 128, 128 ]
  scene_bounds: [ -0.4, -0.4, -0.4, 0.5, 0.5, 0.5 ]
  time_in_state: True
  include_lang_goal_in_obs: True
  vis_pose: False

framework:
  tensorboard_logging: True
  csv_logging: True
  gpu: 0
  logdir: '/peract/ckpts/'
  train_cfg_path: '/peract/conf/config.yaml'
  start_seed: 0
  record_every_n: 5

  eval_envs: 1
  eval_from_eps_number: 50 # current eatio: train/val/test = 150/25/25
  eval_episodes: 100
  eval_demo_type: 'motionplanning'
  eval_type: 'last' # or 'best'
  eval_save_metrics: True
  eval_save_voxel_images: False # whether or not to save voxel images for each pose step during evaluation

cinematic_recorder:
  enabled: False
  camera_resolution: [ 1280, 720 ]
  fps: 30
  rotate_speed: 0.005
  save_path: '/peract/videos/'

wandb:
  use: True
  project_name: 'peract'
  se3aug: True
  exp_name: 'peract-eval-${maniskill3.tasks[0]}-motionplanning-demos-${framework.eval_episodes}-seed-${framework.start_seed}'
